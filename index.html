<style>html,body{margin:0;background:#070718;color:#e8e8ff;font-family:system-ui,sans-serif}#boot{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:10px;text-align:center;padding:20px}#boot b{font-size:22px;letter-spacing:2px}</style>
<link rel="stylesheet" href="/style.css">

<body>
<div id="app">
  <header id="top" hidden></header>
  <div id="net" hidden>📡 Sem conexão — reconectando…</div>
  <div id="updbanner" hidden></div>
  <main id="main">
    <div id="boot"><div style="font-size:54px">🌌</div><b>UNIVERSO CHAT</b><span style="opacity:.7">Carregando…</span></div>
  </main>
  <nav id="nav" hidden>
    <button data-a="tab" data-t="planets"><i>🪐</i><span>Planetas</span></button>
    <button data-a="tab" data-t="social"><i>👥</i><span>Social</span><em class="nav-badge" data-b="social" hidden></em></button>
    <button data-a="tab" data-t="mail"><i>✉️</i><span>Correio</span><em class="nav-badge" data-b="mail" hidden></em></button>
    <button data-a="tab" data-t="room"><i>💬</i><span>Chat</span><em class="nav-badge" data-b="room" hidden></em></button>
    <button data-a="tab" data-t="events"><i>🏆</i><span>Ranking</span></button>
    <button data-a="tab" data-t="feedback"><i>📝</i><span>Feedback</span><em class="nav-badge" data-b="feedback" hidden></em></button>
    <button data-a="tab" data-t="menu"><i>🎒</i><span>Menu</span></button>
    <button data-a="tab" data-t="ownercode" id="owner-code-tab" hidden><i>🛠️</i><span>Dono</span></button>
  </nav>
</div>
<div id="toast" hidden></div>
<div id="umodal" class="umodal-ov" hidden></div>
<noscript><p style="padding:20px">Ative o JavaScript para jogar.</p></noscript>
<script>
// Rede de segurança: se o app.js não carregar em 10s, mostra aviso em vez de tela vazia.
function showBootError(msg) {
  var m = document.getElementById('main');
  if (!m || window.__ok) return;
  m.innerHTML = '<div id="boot"><div style="font-size:54px">😵</div><b>Ops, algo deu errado</b><span style="opacity:.7;max-width:320px;word-break:break-word">' + String(msg || '').replace(/</g, '&lt;') + '</span><button onclick="location.reload()" style="margin-top:12px;padding:12px 22px;border:0;border-radius:12px;background:#7c3aed;color:#fff;font-size:16px">Tentar de novo</button></div>';
}
addEventListener('error', function (e) { if (!window.__ok) showBootError(e.message); });
addEventListener('unhandledrejection', function (e) { if (!window.__ok) showBootError(e.reason && e.reason.message || e.reason); });
setTimeout(function () {
  if (window.__ok) return;
  var m = document.getElementById('main');
  if (m) m.innerHTML = '<div id="boot"><div style="font-size:54px">😵</div><b>Não carregou</b><span style="opacity:.7">O servidor pode estar acordando (leva cerca de 1 min).</span><button onclick="location.reload()" style="margin-top:12px;padding:12px 22px;border:0;border-radius:12px;background:#7c3aed;color:#fff;font-size:16px">Tentar de novo</button></div>';
}, 10000);
</script>

{
  "imports": {

    "three/addons/": "/vendor/three/examples/jsm/"

}
</script>
<script type="module" src="/app.js"></script>
